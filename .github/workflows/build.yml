name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/gradle.properties', '**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Spotless check
        run: ./gradlew spotlessCheck --no-daemon

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Publish to Maven local (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Upload artifact (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lol.trq.alts-${{ github.ref_name }}
          path: build/libs/*.jar

  # Tagging is the whole release ceremony, so a tag that builds green publishes itself. Releases used to
  # be created by hand, which meant they simply were not: six versions shipped with tags and no release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    # Only this job may write to the repository, which is why it is separate from the build.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      # Tests already ran in the build job this depends on; re-running them here would only delay a
      # release that is already known to be green.
      - name: Assemble jars
        run: ./gradlew build -x test --no-daemon

      # Matched by prefix rather than regex: a version is dotted, and the headings carry brackets, so a
      # dynamic pattern needs escaping that does not survive the trip through the shell.
      - name: Extract the changelog section
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::no CHANGELOG section for $VERSION; falling back to generated notes"
          fi

      # Create-or-update, so a re-run of a tag, or a release cut by hand before the runner picked the job
      # up, does not fail the job. `gh release create` errors on an existing tag; `edit` + `upload
      # --clobber` reach the same end state either way.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # `edit` has no --generate-notes, so only rewrite the notes when the changelog gave us some;
            # otherwise leave whatever the release already carries.
            if [ -s release-notes.md ]; then
              gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
            fi
            gh release upload "$GITHUB_REF_NAME" build/libs/*.jar --clobber
          elif [ -s release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md build/libs/*.jar
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --generate-notes build/libs/*.jar
          fi
