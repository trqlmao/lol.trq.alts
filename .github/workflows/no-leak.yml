name: no-leak

# Fail the build if any vendor-internal name leaks into the published library.
# lol.trq.alts is deliberately vendor-neutral. The forbidden terms are NOT stored
# here (that would publish them); they live in the NEUTRALITY_DENYLIST repository
# secret, read at runtime and masked in logs.

on:
  # Only main and release tags. Scanning every branch push duplicated the pull-request
  # scan and, on a branch whose run cannot read the secret, failed outright.
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      DENYLIST: ${{ secrets.NEUTRALITY_DENYLIST }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Forbidden-name scan
        run: |
          set -e
          if [ -z "$DENYLIST" ]; then
            # Repository secrets reach neither a Dependabot run (those read a separate secret store)
            # nor a fork's pull request. Skipping there is safe rather than lenient: both can only
            # propose a change, and the push to main that lands it runs this scan with the secret in
            # hand, over the merged tree. Failing instead would block every dependency bump on a
            # secret the run is not permitted to see.
            if [ "${{ github.actor }}" = "dependabot[bot]" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::NEUTRALITY_DENYLIST unavailable to this run; the scan on main covers it."
              exit 0
            fi
            echo "::error::NEUTRALITY_DENYLIST secret is not set; the neutrality gate cannot run."
            exit 1
          fi
          # Print only the offending file paths, never the matched term, so the
          # secret's contents never appear in the (public) Actions log.
          HITS=$(grep -rlIiE "$DENYLIST" --exclude-dir=.git --exclude-dir=build . || true)
          if [ -n "$HITS" ]; then
            echo "::error::forbidden internal name found in: $HITS"
            exit 1
          fi
          echo "no-leak scan clean"
